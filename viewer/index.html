<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>done — every run</title>
<style>
  :root{
    --bg:#0c0e12; --panel:#13161c; --line:#262b35; --ink:#e6e9ef; --dim:#8b93a3;
    --done:#2fbf71; --stopped:#e5484d; --failed:#e5484d; --needs_human:#f07c28;
    --planning:#4b8bf4; --executing:#a865f7; --verifying:#e0a92b; --pending:#5b6372;
    --unknown:#5b6372;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{border-bottom:1px solid var(--line);padding:22px 26px 18px}
  h1{font-size:15px;margin:0;letter-spacing:.02em}
  h1 span{color:var(--dim);font-weight:400}
  .totals{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px;color:var(--dim);font-size:12px}
  .totals b{color:var(--ink);font-weight:600}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .f{border:1px solid var(--line);background:none;color:var(--dim);border-radius:999px;
    padding:3px 11px;font:inherit;font-size:11px;cursor:pointer;letter-spacing:.05em}
  .f:hover{color:var(--ink)}
  .f.on{border-color:currentColor}
  main{padding:20px 26px 60px;display:grid;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--unknown);border-radius:8px;
    padding:13px 15px;transition:transform .1s,border-color .15s}
  a.card:hover{transform:translateY(-2px);border-color:#3a414f}
  .row1{display:flex;align-items:baseline;gap:9px}
  .vd{font-size:11px;font-weight:700;letter-spacing:.09em}
  .nm{color:var(--dim);font-size:11px;margin-left:auto}
  .star{color:#e0a92b}
  .goal{margin:8px 0 10px;min-height:2.9em;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .bar{height:4px;background:#1c2029;border-radius:3px;overflow:hidden;margin-bottom:9px}
  .bar i{display:block;height:100%;background:var(--done)}
  .bar.part i{background:var(--needs_human)}
  .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
  .chip{border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .chip.q{border-color:var(--needs_human);color:#ffbd8a}
  .chip.fam{border-color:#30b6c4;color:#8adbe4}
  .q{margin-top:9px;font-size:11px;color:#ffbd8a;border-left:2px solid var(--needs_human);
    padding-left:8px}
  .empty{color:var(--dim);padding:50px;grid-column:1/-1;text-align:center}
  footer{color:var(--dim);padding:0 26px 40px;font-size:11px}
  code{background:#171b22;padding:1px 5px;border-radius:3px}
</style>

<header>
  <h1>done <span>— the recursive verifier court · every run, cached</span></h1>
  <div class="totals" id="totals"></div>
  <div class="filters" id="filters"></div>
</header>
<main id="grid"><div class="empty">loading runs/index.json…</div></main>
<footer>
  Each card is a real run. Click one for its tree, checks, verifier verdicts and monitor flags.
  Regenerate this cache with <code>uv run done index</code>.
</footer>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATUS = {DONE:"done", STOPPED:"stopped", NEEDS_HUMAN:"needs_human", FAILED:"failed"};
let DATA = null, filter = "ALL";

function statusVar(verdict){ return STATUS[verdict] || "unknown"; }

function card(r){
  const v = statusVar(r.verdict);
  const pct = r.checks_total ? Math.round(100 * r.checks_passed / r.checks_total) : 0;
  const fams = (r.families || []).length;
  return `<a class="card" href="run.html?run=${encodeURIComponent(r.id)}"
            style="border-left-color:var(--${v})">
    <div class="row1">
      <span class="vd" style="color:var(--${v})">${esc(r.verdict)}</span>
      ${r.preserved ? '<span class="star" title="preserved for replay">★</span>' : ""}
      <span class="nm">${esc(r.name)}</span>
    </div>
    <div class="goal">${esc(r.goal)}</div>
    <div class="bar ${pct === 100 ? "" : "part"}"><i style="width:${pct}%"></i></div>
    <div class="meta">
      <span class="chip">checks ${r.checks_passed}/${r.checks_total}</span>
      <span class="chip">${r.nodes} node${r.nodes === 1 ? "" : "s"}${r.split ? " · split" : ""}</span>
      <span class="chip fam">${fams} famil${fams === 1 ? "y" : "ies"}</span>
      <span class="chip">${(r.tokens || 0).toLocaleString()} tok</span>
      <span class="chip">$${(r.cost_usd || 0).toFixed(4)}</span>
      ${r.monitor && r.monitor.loops ? `<span class="chip q">⚑ ${r.monitor.loops} loop</span>` : ""}
      ${r.monitor && r.monitor.checks_rewritten
        ? `<span class="chip q">${r.monitor.checks_rewritten} checks rewritten</span>` : ""}
    </div>
    ${(r.human_questions || []).length
      ? `<div class="q">needs a human: ${esc(r.human_questions[0])}${
           r.human_questions.length > 1 ? ` (+${r.human_questions.length - 1} more)` : ""}</div>`
      : ""}
  </a>`;
}

function render(){
  const rows = DATA.runs.filter(r => filter === "ALL" || r.verdict === filter);
  document.getElementById("grid").innerHTML =
    rows.length ? rows.map(card).join("")
                : `<div class="empty">no runs with verdict ${esc(filter)}</div>`;

  const t = DATA.totals;
  document.getElementById("totals").innerHTML = [
    `<span><b>${t.runs}</b> runs</span>`,
    `<span><b>${t.checks_passed}/${t.checks_total}</b> checks re-run by an independent family</span>`,
    `<span><b>${t.tokens.toLocaleString()}</b> tokens</span>`,
    `<span><b>$${t.cost_usd.toFixed(4)}</b> total</span>`,
    `<span><b>${t.families.length}</b> model families</span>`,
  ].join("");

  const counts = DATA.totals.verdicts || {};
  const keys = ["ALL", ...Object.keys(counts)];
  document.getElementById("filters").innerHTML = keys.map(k => {
    const n = k === "ALL" ? DATA.runs.length : counts[k];
    const col = k === "ALL" ? "var(--dim)" : `var(--${statusVar(k)})`;
    return `<button class="f ${filter === k ? "on" : ""}" data-k="${k}"
              style="color:${col}">${esc(k)} ${n}</button>`;
  }).join("");
  document.querySelectorAll(".f").forEach(b =>
    b.onclick = () => { filter = b.dataset.k; render(); });
}

(async () => {
  try{
    DATA = await (await fetch("../runs/index.json", {cache:"no-store"})).json();
    render();
  }catch(e){
    document.getElementById("grid").innerHTML =
      `<div class="empty">could not read <code>runs/index.json</code> —
       run <code>uv run done index</code> first, and serve from the repo root.</div>`;
  }
})();
</script>
