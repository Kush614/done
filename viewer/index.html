<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>done — every run</title>
<style>
  /* Gumroad-style: cream ground, 1px black everything, hard offset shadows, flat vivid fills */
  :root{
    --bg:#F4F4F0; --ink:#000; --dim:#5f5f58; --panel:#fff; --line:#000;
    --pink:#FF90E8; --yellow:#FFC900; --teal:#23A094; --mint:#90DFD3;
    --lilac:#DBD5FC; --sky:#B3C1FF; --red:#DC341E; --grey:#E8E8E2;
    --done:#23A094; --stopped:#DC341E; --failed:#DC341E;
    --needs_human:#FF90E8; --unknown:#DBD5FC;
    --shadow:4px 4px 0 var(--ink);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  header{border-bottom:1px solid var(--ink);padding:26px 30px 20px;background:var(--pink)}
  h1{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:800}
  h1 span{font-weight:500;font-size:17px;letter-spacing:-.01em}
  .totals{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:13px}
  .totals span{background:#fff;border:1px solid var(--ink);border-radius:999px;
    padding:4px 13px;font-weight:500}
  .totals b{font-weight:800}
  .filters{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .f{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;
    padding:6px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .f:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
  .f:active,.f.on{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .f.on{background:var(--ink);color:#fff}
  main{padding:28px 30px 70px;display:grid;gap:22px;
    grid-template-columns:repeat(auto-fill,minmax(370px,1fr))}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);
    border:1px solid var(--ink);border-radius:4px;padding:0;overflow:hidden;
    box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
  a.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
  .row1{display:flex;align-items:center;gap:9px;padding:11px 15px;
    border-bottom:1px solid var(--ink)}
  .vd{font-size:12px;font-weight:800;letter-spacing:.06em}
  .nm{margin-left:auto;font-size:12px;font-weight:600;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .star{font-size:14px}
  /* padding on a -webkit-box breaks line-clamp, so the box gets margins only and a height
     of exactly two lines */
  .goal{margin:14px 15px 12px;padding:0;font-size:15px;font-weight:600;line-height:1.35;
    height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical}
  .bar{height:10px;margin:2px 15px 13px;background:var(--grey);
    border:1px solid var(--ink);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--teal)}
  .bar.part i{background:var(--yellow)}
  .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;align-content:flex-start;
    font-size:12px;padding:0 15px 15px}
  .chip{border:1px solid var(--ink);border-radius:999px;padding:2px 9px;background:#fff;
    font-weight:600}
  .chip.q{background:var(--yellow)}
  .chip.fam{background:var(--sky)}
  .q{margin:0 15px 15px;font-size:13px;background:var(--pink);
    border:1px solid var(--ink);border-radius:4px;padding:9px 11px;font-weight:600}
  .empty{padding:60px;grid-column:1/-1;text-align:center;font-weight:600}
  footer{padding:0 30px 50px;font-size:13px;max-width:760px}
  code{background:#fff;border:1px solid var(--ink);padding:1px 6px;border-radius:3px;
    font-size:12px}
</style>

<header>
  <h1>done <span>— the recursive verifier court · every run, cached</span></h1>
  <div class="totals" id="totals"></div>
  <div class="filters" id="filters"></div>
</header>
<main id="grid"><div class="empty">loading runs/index.json…</div></main>
<footer>
  Each card is a real run. Click one for its tree, checks, verifier verdicts and monitor flags.
  Regenerate this cache with <code>uv run done index</code>.
</footer>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATUS = {DONE:"done", STOPPED:"stopped", NEEDS_HUMAN:"needs_human", FAILED:"failed"};
let DATA = null, filter = "ALL";

function statusVar(verdict){ return STATUS[verdict] || "unknown"; }

function card(r){
  const v = statusVar(r.verdict);
  const pct = r.checks_total ? Math.round(100 * r.checks_passed / r.checks_total) : 0;
  const fams = (r.families || []).length;
  return `<a class="card" href="run.html?run=${encodeURIComponent(r.id)}"
            style="">
    <div class="row1">
      <span class="vd" style="background:var(--${v});border:1px solid #000;border-radius:999px;padding:3px 10px">${esc(r.verdict)}</span>
      ${r.preserved ? '<span class="star" title="preserved for replay">★</span>' : ""}
      <span class="nm">${esc(r.name)}</span>
    </div>
    <div class="goal">${esc(r.goal)}</div>
    <div class="bar ${pct === 100 ? "" : "part"}"><i style="width:${pct}%"></i></div>
    <div class="meta">
      <span class="chip">checks ${r.checks_passed}/${r.checks_total}</span>
      <span class="chip">${r.nodes} node${r.nodes === 1 ? "" : "s"}${r.split ? " · split" : ""}</span>
      <span class="chip fam">${fams} famil${fams === 1 ? "y" : "ies"}</span>
      <span class="chip">${(r.tokens || 0).toLocaleString()} tok</span>
      <span class="chip">$${(r.cost_usd || 0).toFixed(4)}</span>
      ${r.monitor && r.monitor.loops ? `<span class="chip q">⚑ ${r.monitor.loops} loop</span>` : ""}
      ${r.monitor && r.monitor.checks_rewritten
        ? `<span class="chip q">${r.monitor.checks_rewritten} checks rewritten</span>` : ""}
    </div>
    ${(r.human_questions || []).length
      ? `<div class="q">needs a human: ${esc(r.human_questions[0])}${
           r.human_questions.length > 1 ? ` (+${r.human_questions.length - 1} more)` : ""}</div>`
      : ""}
  </a>`;
}

function render(){
  const rows = DATA.runs.filter(r => filter === "ALL" || r.verdict === filter);
  document.getElementById("grid").innerHTML =
    rows.length ? rows.map(card).join("")
                : `<div class="empty">no runs with verdict ${esc(filter)}</div>`;

  const t = DATA.totals;
  document.getElementById("totals").innerHTML = [
    `<span><b>${t.runs}</b> runs</span>`,
    `<span><b>${t.checks_passed}/${t.checks_total}</b> checks re-run by an independent family</span>`,
    `<span><b>${t.tokens.toLocaleString()}</b> tokens</span>`,
    `<span><b>$${t.cost_usd.toFixed(4)}</b> total</span>`,
    `<span><b>${t.families.length}</b> model families</span>`,
  ].join("");

  const counts = DATA.totals.verdicts || {};
  const keys = ["ALL", ...Object.keys(counts)];
  document.getElementById("filters").innerHTML = keys.map(k => {
    const n = k === "ALL" ? DATA.runs.length : counts[k];
    const bg = k === "ALL" || filter === k ? "" : `background:var(--${statusVar(k)})`;
    return `<button class="f ${filter === k ? "on" : ""}" data-k="${k}"
              style="${bg}">${esc(k)} ${n}</button>`;
  }).join("");
  document.querySelectorAll(".f").forEach(b =>
    b.onclick = () => { filter = b.dataset.k; render(); });
}

(async () => {
  try{
    DATA = await (await fetch("../runs/index.json", {cache:"no-store"})).json();
    render();
  }catch(e){
    document.getElementById("grid").innerHTML =
      `<div class="empty">could not read <code>runs/index.json</code> —
       run <code>uv run done index</code> first, and serve from the repo root.</div>`;
  }
})();
</script>
